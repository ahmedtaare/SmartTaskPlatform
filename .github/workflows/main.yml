
name: SmartTaskPlatform CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build-test-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Restore dependencies
        run: dotnet restore SmartTaskPlatform.slnx

      - name: Build solution
        run: dotnet build SmartTaskPlatform.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test SmartTaskPlatform.slnx --configuration Release --no-build

      - name: Publish API
        run: dotnet publish SmartTaskPlatform.Api/SmartTaskPlatform.Api.csproj --configuration Release --no-build --output ./publish/api

      - name: Publish Blazor
        run: dotnet publish SmartTaskPlatform/SmartTaskPlatform.csproj --configuration Release --no-build --output ./publish/web

      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: smarttask-api
          path: publish/api/

      - name: Upload Blazor artifact
        uses: actions/upload-artifact@v4
        with:
          name: smarttask-web
          path: publish/web/
